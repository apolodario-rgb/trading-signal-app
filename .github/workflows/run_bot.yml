name: Trading Bot

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install yfinance requests
      - run: python trading_bot.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      - name: Commit signal log
        run: |
          git config --global user.name "trading-bot"
          git config --global user.email "actions@github.com"
          git add signal_log.csv
          git diff --staged --quiet && echo "No changes to log" || git commit -m "Update signal log"
          git push
